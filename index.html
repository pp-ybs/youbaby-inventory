function InvDashboard({rows,onOpen,go}){
 const [adv,setAdv]=useState(null),[advBusy,setAdvBusy]=useState(false);
 useEffect(()=>{if(sb)sb.from("daily_advisory").select("*").order("created_at",{ascending:false}).limit(1).maybeSingle().then(({data})=>setAdv(data||null));},[]);
 const runAdv=async()=>{if(advBusy)return;setAdvBusy(true);try{const res=await fetch(SB_URL+"/functions/v1/daily-advisory",{method:"POST",headers:{"content-type":"application/json","apikey":SB_KEY,"authorization":"Bearer "+SB_KEY},body:"{}"});const j=await res.json().catch(()=>null);if(j&&j.advisory)setAdv(j.advisory);}catch(e){}setAdvBusy(false);};
 const boldify=s=>s.split(/(\*\*[^*]+\*\*)/g).map((p,i)=>p.startsWith("**")&&p.endsWith("**")?<b key={i}>{p.slice(2,-2)}</b>:<span key={i}>{p}</span>);
 const renderAdv=text=>(text||"").split("\n").map((ln,i)=>{const t=ln.trim();if(!t)return <div key={i} style={{height:5}}/>;if(/^[-•*]\s+/.test(t))return <div key={i} style={{display:"flex",gap:7,fontSize:12.5,lineHeight:1.5,margin:"2px 0"}}><span style={{color:"var(--muted)"}}>•</span><span>{boldify(t.replace(/^[-•*]\s+/,""))}</span></div>;return <div key={i} style={{fontSize:12.5,lineHeight:1.5,margin:"3px 0",fontWeight:t.startsWith("**")?700:400}}>{boldify(t)}</div>;});
 const active=rows.filter(r=>!r.archived);
 const setups=active.filter(r=>r.type==="theme").length, items=active.length-setups;
 const archived=rows.length-active.length;
 const valTot={};active.forEach(r=>{if(r.value!=null&&r.value!=="")valTot[r.value_currency||"AED"]=(valTot[r.value_currency||"AED"]||0)+Number(r.value||0);});
 const valStr=Object.entries(valTot).map(([c,n])=>c+" "+n.toLocaleString()).join(" · ")||"—";
 const branchSel=(r,b)=>(r.inv_item_location||[]).find(l=>l.location===b)?.times_selected||0;
 const attention=active.filter(r=>r.op_status==="In repair"||(r.inv_item_location||[]).some(l=>l.condition==="Poor"||l.condition==="Damaged"));
 const forSale=active.filter(r=>r.op_status==="For sale");
 const noPhoto=active.filter(r=>!r.photo_url);
 const perStudio=BR.map(b=>({b,n:active.filter(r=>(r.inv_item_location||[]).some(l=>l.location===b)).length,qty:active.reduce((s,r)=>s+(r.inv_item_location||[]).filter(l=>l.location===b).reduce((a,l)=>a+(l.quantity||0),0),0)})).filter(s=>s.n>0);
 const used=active.filter(tracksUse);
 const top=[...used].sort((a,b)=>invSel(b)-invSel(a)).filter(r=>invSel(r)>0).slice(0,6);
 const unused=used.filter(r=>invSel(r)===0);
 const popByBranch=BR.map(b=>({b,list:[...used].filter(r=>branchSel(r,b)>0).sort((x,y)=>branchSel(y,b)-branchSel(x,b)).slice(0,5)})).filter(x=>x.list.length);
 const row=(r,right,rc)=><div key={r.id} onClick={()=>onOpen&&onOpen(r)} className="trow fade" style={{display:"flex",alignItems:"center",gap:10,padding:"6px 8px",borderRadius:9,cursor:"pointer"}}>
   <div style={{width:34,height:34,borderRadius:9,overflow:"hidden",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:r.photo_url?"var(--line)":itemIcon(r).c+"16"}}>{r.photo_url?<img src={r.photo_url} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<Icon d={itemIcon(r).d} s={17} c={itemIcon(r).c} sw={1.7}/>}</div>
   <div style={{flex:1,minWidth:0}}><div style={{fontSize:12.5,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.name||r.code}</div><div style={{fontSize:10.5,color:"var(--muted)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{[r.session_type,r.subcategory||r.kind].filter(Boolean).join(" · ")}</div></div>
   <div style={{fontSize:11,fontWeight:700,color:rc||"var(--soft)",whiteSpace:"nowrap"}}>{right}</div></div>;
 const panel={background:"var(--panel)",border:"1px solid var(--line)",borderRadius:9,padding:"16px 18px",flex:"1 1 280px",minWidth:250,boxShadow:"var(--shadow)"};
 const h={fontSize:13.5,fontWeight:700,color:"var(--ink)",marginBottom:12,display:"flex",alignItems:"center",gap:7};
 return <div className="scroll fade" style={{flex:1,padding:"26px 30px",overflow:"auto"}}>
  <h1 style={{fontSize:25,fontWeight:800,letterSpacing:"-.02em"}}>Overview</h1>
  <p style={{color:"var(--muted)",fontSize:13,marginTop:2,marginBottom:18}}>What's happening across your studios{archived?` · ${archived} archived`:""}.</p>
  <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-start",marginBottom:14}}>
   <StatCard label="Items" value={active.length} sub={setups+" setups · "+items+" items"}/>
   <StatCard label="Total value" value={valStr} sub="declared, per currency"/>
   <StatCard label="Needs attention" value={attention.length} sub="damaged or in repair" color={attention.length?"#ff5a5f":"var(--ink)"}/>
   <StatCard label="Dead stock" value={unused.length} sub="setups/outfits never used" color={unused.length?"#6b7280":"var(--ink)"}/>
  </div>
  <div style={{...panel,flex:"1 1 100%",marginBottom:14,borderLeft:"3px solid var(--accent)"}}>
   <div style={h}><span style={{fontSize:15}}>🩺</span>Daily briefing<span style={{flex:1}}/>{adv&&adv.created_at&&<span style={{fontSize:11,color:"var(--muted)",fontWeight:400}}>{fmtDate(adv.created_at)}</span>}<button onClick={runAdv} disabled={advBusy} style={{padding:"6px 12px",borderRadius:8,border:"1px solid var(--line2)",background:"var(--panel)",color:"var(--soft)",fontWeight:600,fontSize:12,cursor:advBusy?"default":"pointer"}}>{advBusy?"Checking…":"Run now"}</button></div>
   {adv&&adv.counts&&<div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>{[["In repair",adv.counts.in_repair,"#f0a23c"],["Poor / damaged",adv.counts.poor_or_damaged,"#ff5a5f"],["Flagged",adv.counts.flagged_comments,"#7c4dff"],["Missing photo",adv.counts.missing_photo,"#6b7280"]].map(([l,n,c])=><span key={l} style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:11.5,fontWeight:600,color:n?c:"var(--muted)",background:(n?c:"#9aa0b0")+"16",borderRadius:20,padding:"3px 11px"}}><Dot c={n?c:"#c4c7d2"} s={6}/>{l}: {n}</span>)}</div>}
   {adv?<div style={{color:"var(--ink)"}}>{renderAdv(adv.summary)}</div>:<div style={{fontSize:12.5,color:"var(--muted)"}}>No briefing yet — it runs automatically each morning, or press <b>Run now</b>.</div>}
  </div>
  {popByBranch.length>0&&<div style={{...panel,flex:"1 1 100%",marginBottom:14}}><div style={h}><Icon d={I.cursor} s={15} c="var(--muted)" sw={1.7}/>Popular setups by studio</div>
   <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:16}}>{popByBranch.map(({b,list})=><div key={b}><div style={{display:"flex",alignItems:"center",gap:7,marginBottom:7,fontSize:12,fontWeight:700,color:BR_COLOR[b]}}><Dot c={BR_COLOR[b]} s={8}/>{b}</div><div style={{display:"flex",flexDirection:"column",gap:3}}>{list.map(r=>row(r,branchSel(r,b)+"×","var(--ink)"))}</div></div>)}</div></div>}
  <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-start",marginBottom:14}}>
   <div style={panel}><div style={h}>Equipment status</div>{["Available","In repair","For sale","Retired"].map(s=>{const n=active.filter(r=>r.op_status===s).length;const c=s==="Available"?"#22b573":s==="In repair"?"#f0a23c":s==="For sale"?"#7c4dff":"#9aa0b0";return <div key={s} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><Dot c={c} s={9}/><span style={{fontSize:12,color:"var(--soft)",flex:1}}>{s}</span><span style={{fontSize:12,fontWeight:700}}>{n}</span></div>})}</div>
   <div style={panel}><div style={h}>By studio</div>{perStudio.map(s=><div key={s.b} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><Dot c={BR_COLOR[s.b]} s={9}/><span style={{fontSize:12,color:"var(--soft)",flex:1}}>{s.b}</span><span style={{fontSize:12,fontWeight:700}}>{s.n} <span style={{color:"var(--muted)",fontWeight:400}}>· {s.qty} qty</span></span></div>)}</div>
   <div style={panel}><div style={h}><Icon d={I.cursor} s={15} c="var(--muted)" sw={1.7}/>Most used overall</div><div style={{display:"flex",flexDirection:"column",gap:4}}>{top.length?top.map(r=>row(r,invSel(r)+"×","var(--ink)")):<span style={{fontSize:12,color:"var(--muted)"}}>No usage recorded yet.</span>}</div></div>
  </div>
  {attention.length>0&&<div style={{...panel,marginBottom:14,flex:"1 1 100%"}}><div style={h}><Dot c="#ff5a5f" s={9}/>Worth a look <span style={{color:"var(--muted)",fontWeight:400}}>— damaged / in repair ({attention.length})</span></div><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:6}}>{attention.map(r=>{const lab=r.op_status==="In repair"?"In repair":((r.inv_item_location||[]).filter(l=>l.condition==="Poor"||l.condition==="Damaged").map(l=>l.condition)[0]||"");const col=r.op_status==="In repair"?"#d97706":"#ff5a5f";return row(r,<span style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:10.5,fontWeight:600,color:col,background:col+"1c",borderRadius:20,padding:"2px 9px"}}>{lab}</span>);})}</div></div>}
  {(forSale.length>0||noPhoto.length>0)&&<div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-start",marginBottom:14}}>
   {forSale.length>0&&<div style={panel}><div style={h}><Dot c="#7c4dff" s={9}/>For sale ({forSale.length})</div><div style={{display:"flex",flexDirection:"column",gap:4}}>{forSale.slice(0,6).map(r=>row(r,r.value!=null?(r.value_currency||"")+" "+r.value:"","#7c4dff"))}</div></div>}
   {noPhoto.length>0&&<div style={panel}><div style={h}>Missing a photo</div><div style={{fontSize:24,fontWeight:800}}>{noPhoto.length}</div><div style={{fontSize:11.5,color:"var(--muted)",marginTop:2}}>items without an image</div></div>}
  </div>}
  {unused.length>0&&<div style={{...panel,flex:"1 1 100%"}}><div style={h}><Dot c="#f0a23c" s={9}/>Dead stock <span style={{color:"var(--muted)",fontWeight:400}}>— setups/outfits never selected ({unused.length})</span></div><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:6}}>{unused.slice(0,18).map(r=>row(r,ageLabel(acqOf(r))))}</div></div>}
 </div>;
}
function App(){
 const [themes,setThemes]=useState(()=>D.themes.map(t=>({...t})));
 const [source,setSource]=useState("local");
 const [invRows,setInvRows]=useState([]);
 const loadInv=()=>{if(sb)sb.from("inv_item").select("*,inv_item_location(location,quantity,times_selected,condition,acquired_on)").then(({data})=>setInvRows(data||[]));};
 const [taxV,setTaxV]=useState(0);
 useEffect(()=>{loadInv()},[]);
 useEffect(()=>{loadTax().then(()=>setTaxV(v=>v+1))},[]);
 useEffect(()=>{_taxBump=()=>setTaxV(v=>v+1);return()=>{_taxBump=()=>{};}},[]);
 // SINGLE SOURCE: map inv_item rows into the shape the catalogue views expect
 const allThemes=useMemo(()=>invRows.filter(r=>!r.archived).map(r=>({id:r.id,name:r.name,category:r.session_type,gender:r.gender||"",branches:(r.inv_item_location||[]).map(l=>l.location),display:!!r.website_display,selection_count:r.times_selected||0,image:r.photo_url||"",notes:r.notes||"",__inv:true,_row:r})),[invRows]);
 const [toast,setToast]=useState("");
 const notify=m=>{setToast(m);setTimeout(()=>setToast(""),4500);};
 const [session,setSession]=useState(sb?undefined:null);
 useEffect(()=>{if(!sb)return;sb.auth.getSession().then(({data})=>{setSession(data.session);ME=(data.session&&data.session.user&&data.session.user.email)||"";});const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>{setSession(s);ME=(s&&s.user&&s.user.email)||"";});return ()=>sub.subscription.unsubscribe()},[]);
 const [view,setView]=useState(()=>/^#show=/.test(window.location.hash||"")?"showcase":"dashboard");
 const [catInit,setCatInit]=useState("");
 const [sel,setSel]=useState(null); const [form,setForm]=useState(null); // form = {} for new, theme for edit
 const [q,setQ]=useState(""),[cat,setCat]=useState(""),[br,setBr2]=useState(""),[gen,setGen]=useState(""),[disp,setDisp]=useState(""),[onlyPhoto,setOnlyPhoto]=useState(false),[sort,setSort]=useState("pop"),[mode,setMode]=useState("grid");
 useEffect(()=>{(async()=>{
   if(!sb){const c=localStorage.getItem("ybs_themes_v2");if(c)setThemes(JSON.parse(c));return;}
   try{const {data,error}=await sb.from("themes").select("*");
     if(!error&&data&&data.length){setThemes(data);setSource("cloud");}
     else{const c=localStorage.getItem("ybs_themes_v2");if(c)setThemes(JSON.parse(c));}
   }catch(e){const c=localStorage.getItem("ybs_themes_v2");if(c)setThemes(JSON.parse(c));}
 })()},[]);
 const persist=ts=>{if(source!=="cloud")localStorage.setItem("ybs_themes_v2",JSON.stringify(ts));};
 const toggle=async t=>{
   if(t.__inv){const nd=!t.display;setInvRows(rs=>rs.map(x=>x.id===t.id?{...x,website_display:nd}:x));if(sb){const {error}=await sb.from("inv_item").update({website_display:nd}).eq("id",t.id);if(error){setInvRows(rs=>rs.map(x=>x.id===t.id?{...x,website_display:!nd}:x));notify("Couldn't save change: "+error.message);}}return;}
   const nd=!t.display;setThemes(ts=>{const n=ts.map(x=>x.id===t.id?{...x,display:nd}:x);persist(n);return n});if(source==="cloud"&&sb){const {error}=await sb.from("themes").update({display:nd}).eq("id",t.id);if(error){setThemes(ts=>{const n=ts.map(x=>x.id===t.id?{...x,display:!nd}:x);persist(n);return n});notify("Couldn't save change: "+error.message);}}};
 const saveTheme=async d=>{
   const isNew=!d.id; const row={...d,id:d.id||newId(d.category,themes)};
   delete row.popularity; // selection_count is the source of truth in UI
   const prev=themes;
   setThemes(ts=>{const n=isNew?[row,...ts]:ts.map(x=>x.id===row.id?{...x,...row}:x);persist(n);return n});
   setForm(null); if(sel&&sel.id===row.id)setSel(row);
   if(source==="cloud"&&sb){const {error}=await sb.from("themes").upsert(row);if(error){setThemes(()=>{persist(prev);return prev});notify("Couldn't save theme: "+error.message);}}
 };
 const delTheme=async t=>{const prev=themes;setThemes(ts=>{const n=ts.filter(x=>x.id!==t.id);persist(n);return n});setSel(null);if(source==="cloud"&&sb){const {error}=await sb.from("themes").delete().eq("id",t.id);if(error){setThemes(()=>{persist(prev);return prev});notify("Couldn't delete: "+error.message);}}};
 const openCat=c=>{setCatInit(c);setView("catalog")}; const openBr=b=>{setBr2(b);setView("catalog")};
 const navTo=id=>{if(id==="catalog")setCatInit("");setView(id)};
 const go=x=>{if(x&&x.__cat)openCat(x.__cat);else if(typeof x==="string")openCat(x);else setSel(x)};
 const selLive=sel?allThemes.find(t=>t.id===sel.id)||sel:null;
 const catState={q,setQ,cat,setCat,br,setBr:setBr2,gen,setGen,disp,setDisp,onlyPhoto,setOnlyPhoto,sort,setSort,mode,setMode};
 const signOut=()=>sb&&sb.auth.signOut();
 const pubM=/^#p=(.*)$/.exec(window.location.hash||"");
 if(pubM) return <PublicShowcase scope={decodeURIComponent(pubM[1])}/>;
 if(sb&&session===undefined) return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--muted)",fontSize:14}}>Loading…</div>;
 if(sb&&!session) return <LoginScreen/>;
 return <div style={{display:"flex",height:"100vh",overflow:"hidden"}}>
   <Sidebar view={view} setView={navTo} themes={allThemes} setBr={openBr} source={source} signOut={signOut} email={session&&session.user&&session.user.email}/>
   <main className="app-main" style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",background:"var(--bg)"}}>
     {view==="dashboard"&&<InvDashboard rows={invRows} go={openCat} onOpen={r=>setSel(allThemes.find(t=>t.id===r.id)||{id:r.id,__inv:true,_row:r})}/>}
     {view==="catalog"&&<NewInventory initCat={catInit}/>}
     {view==="showcase"&&<Showcase themes={allThemes} onOpen={setSel} onItemsChanged={loadInv}/>}
     {view==="categories"&&<Categories themes={allThemes} go={openCat}/>}
     {view==="settings"&&<Settings key={taxV} onSaved={()=>setTaxV(v=>v+1)} notify={notify} rows={invRows} email={session&&session.user&&session.user.email} signOut={signOut} onNav={navTo}/>}
   </main>
   <nav className="app-mobnav" style={{position:"fixed",bottom:0,left:0,right:0,zIndex:90,background:"rgba(255,255,255,.92)",backdropFilter:"blur(12px)",borderTop:"1px solid var(--line)",height:"64px",alignItems:"center",justifyContent:"space-around",padding:"0 6px"}}>
     {NAV.map(n=>{const a=view===n.id;return <button key={n.id} onClick={()=>navTo(n.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,flex:1,padding:"6px 0",color:a?"var(--accent)":"var(--muted)"}}><Icon d={n.icon} s={21} c={a?"var(--accent)":"var(--muted)"}/><span style={{fontSize:9.5,fontWeight:a?700:500,letterSpacing:"-.01em"}}>{n.label.split(" ")[0]}</span></button>})}
   </nav>
   {selLive&&selLive.__inv&&<InvEdit item={selLive._row} onClose={()=>setSel(null)} onSaved={()=>{setSel(null);loadInv();}}/>}
   {selLive&&!selLive.__inv&&<Drawer t={selLive} onClose={()=>setSel(null)} onToggle={toggle} onEdit={t=>{setSel(null);setForm(t)}} onDelete={delTheme}/>}
   {form&&<ThemeForm init={form} onSave={saveTheme} onClose={()=>setForm(null)}/>}
   {toast&&<div className="fade" onClick={()=>setToast("")} style={{position:"fixed",bottom:22,left:"50%",transform:"translateX(-50%)",zIndex:400,background:"var(--danger)",color:"#fff",padding:"11px 18px",borderRadius:8,fontSize:13,fontWeight:600,boxShadow:"0 8px 24px rgba(20,20,30,.18)",maxWidth:"90vw",cursor:"pointer"}}>{toast}</div>}
 </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
