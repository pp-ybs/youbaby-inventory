// ---- photo upload (to Supabase Storage, in-app) ----
function PhotoField({value,onChange,prefix}){
 const [busy,setBusy]=useState(false),[err,setErr]=useState("");
 const inp=useRef();
 const pick=async e=>{
   const file=e.target.files&&e.target.files[0]; if(!file)return;
   if(!sb){setErr("No connection — can't upload");return;}
   setBusy(true);setErr("");
   try{
     const ext=((file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg');
     const path=`images/${prefix}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}.${ext}`;
     const up=await sb.storage.from('app').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});
     if(up.error)throw up.error;
     onChange(sb.storage.from('app').getPublicUrl(path).data.publicUrl);
   }catch(ex){setErr((ex&&ex.message)||"Upload failed");}
   setBusy(false); if(inp.current)inp.current.value="";
 };
 return <div>
   <div style={{display:"flex",gap:8}}>
     <input value={value||""} onChange={e=>onChange(e.target.value)} placeholder="https://…  or click Upload →" style={{flex:1}}/>
     <button type="button" onClick={()=>inp.current&&inp.current.click()} disabled={busy} style={{whiteSpace:"nowrap",padding:"9px 15px",border:"1px solid var(--line2)",borderRadius:10,fontWeight:600,fontSize:13,background:busy?"var(--panel2)":"var(--panel)",color:"var(--ink)",display:"inline-flex",alignItems:"center",gap:6}}><Icon d={I.image} s={15}/>{busy?"Uploading…":"Upload"}</button>
   </div>
   <input ref={inp} type="file" accept="image/*" onChange={pick} style={{display:"none"}}/>
   {err&&<div style={{fontSize:11.5,color:"var(--danger)",marginTop:6}}>{err}</div>}
 </div>;
}

// ---- add / edit form ----
function ThemeForm({init,onSave,onClose}){
 const blank={name:"",category:"Newborn",gender:"",branches:[],display:true,selection_count:0,condition:"Good",image:"",notes:""};
 const [f,setF]=useState({...blank,...init,branches:(init&&init.branches)||[]});
 const set=(k,v)=>setF(p=>({...p,[k]:v}));
 const tb=b=>set("branches",f.branches.includes(b)?f.branches.filter(x=>x!==b):[...f.branches,b]);
 useEffect(()=>{const h=e=>e.key==="Escape"&&onClose();window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[]);
 const valid=f.name.trim();
 return <div style={{position:"fixed",inset:0,background:"#1a1a2433",backdropFilter:"blur(3px)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>e.target===e.currentTarget&&onClose()}>

       <button onClick={onClose} style={{padding:4}}><Icon d={I.x} s={19} c="var(--muted)"/></button></div>
     <div style={{padding:24,display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
       <div style={{gridColumn:"1/-1"}}><label>THEME NAME *</label><input value={f.name} onChange={e=>set("name",e.target.value)} placeholder="e.g. Duckies" autoFocus/></div>
       <div><label>CATEGORY</label><select value={f.category} onChange={e=>set("category",e.target.value)}>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
       <div><label>GENDER</label><select value={f.gender} onChange={e=>set("gender",e.target.value)}><option value="">—</option>{GENDERS.map(g=><option key={g}>{g}</option>)}</select></div>

       <div><label>CONDITION</label><select value={f.condition} onChange={e=>set("condition",e.target.value)}>{CONDS.map(c=><option key={c}>{c}</option>)}</select></div>
       <div style={{gridColumn:"1/-1"}}><label>PHOTO <span style={{color:"var(--muted)",fontWeight:400}}>(upload from your device, or paste a link / file name)</span></label><PhotoField value={f.image} onChange={v=>set("image",v)} prefix="themes"/></div>

const DITYPES=["setup","outfit","fabric","background","prop","accessory","backdrop","other"];
// item_types that live in the "Items & Props" section (cross-shoot stuff), not in the shoot-category view.
// NOTE: maternity fabrics stay in their shoot category (Maternity) — only backgrounds/backdrops/props/accessories move here.
const PROP_TYPES=["backdrop","background","prop","accessory","other"];
const PROP_GROUP={backdrop:"Backdrops",background:"Backgrounds",prop:"Props",accessory:"Accessories",other:"Other"};
// shoot types an item can be used for (usable_for)
const SHOOT_TYPES=["Maternity","Newborn","Sitter","Infant","Cake Smash","Children"];
const dTC=t=>t==="fabric"||t==="background"||t==="backdrop"?"#a47cd1":(t==="prop"||t==="accessory")?"#48b08c":t==="outfit"?"#e06b94":t==="setup"?"#cf8a1e":"#9a9ca8";
function DohaEdit({item,onSave,onClose,allItems=[],links=[],onLink,onUnlink}){
 const [f,setF]=useState({...item});
 const set=(k,v)=>setF(p=>({...p,[k]:v}));
 const isSetup=item.item_type!=="outfit";
 const pairType=isSetup?"outfit":"setup";
 const byId=Object.fromEntries(allItems.map(i=>[i.id,i]));
 const linkedIds=links.filter(l=>isSetup?l.setup_id===item.id:l.outfit_id===item.id).map(l=>isSetup?l.outfit_id:l.setup_id);
 const candidates=allItems.filter(i=>i.location===item.location&&i.id!==item.id&&(pairType==="outfit"?i.item_type==="outfit":i.item_type!=="outfit")&&!linkedIds.includes(i.id));
 const doLink=id=>isSetup?onLink(item.id,id):onLink(id,item.id);
 const doUnlink=id=>isSetup?onUnlink(item.id,id):onUnlink(id,item.id);
 useEffect(()=>{const h=e=>e.key==="Escape"&&onClose();window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[]);
 return <div style={{position:"fixed",inset:0,background:"#1a1a2433",backdropFilter:"blur(3px)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>e.target===e.currentTarget&&onClose()}>
   <div className="scroll fade" style={{width:560,maxWidth:"96vw",maxHeight:"92vh",background:"var(--panel)",borderRadius:18,boxShadow:"0 30px 80px rgba(20,20,30,.25)",overflow:"auto"}}>
     <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 24px",borderBottom:"1px solid var(--line)",position:"sticky",top:0,background:"var(--panel)",zIndex:1}}>
       <div><span style={{fontWeight:700,fontSize:16}}>Edit item</span><div style={{fontSize:11,color:"var(--muted)",marginTop:2}}>{f.id} · {f.category} · Doha</div></div>
       <button onClick={onClose} style={{padding:4}}><Icon d={I.x} s={19} c="var(--muted)"/></button></div>
     {f.photo&&<div style={{padding:"16px 24px 0"}}><img src={f.photo} style={{width:"100%",maxHeight:460,objectFit:"contain",borderRadius:12,border:"1px solid var(--line)",background:"var(--panel2)"}} onError={e=>e.target.style.display="none"}/></div>}
     <div style={{padding:24,display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
       <div style={{gridColumn:"1/-1"}}><label>NAME / DESCRIPTION</label><input value={f.name||""} onChange={e=>set("name",e.target.value)} placeholder="e.g. Classic Long Gown - Black"/></div>
       <div><label>TYPE</label><select value={f.item_type||""} onChange={e=>set("item_type",e.target.value)}><option value="">—</option>{DITYPES.map(t=><option key={t}>{t}</option>)}</select></div>
       <div><label>GENDER</label><select value={f.gender||""} onChange={e=>set("gender",e.target.value)}><option value="">—</option>{GENDERS.map(g=><option key={g}>{g}</option>)}</select></div>
       <div><label>SIZE / MEASUREMENT</label><input value={f.measurement||""} onChange={e=>set("measurement",e.target.value)} placeholder="e.g. M-L / 4 Meters"/></div>
       <div><label>QUANTITY</label><input value={f.quantity||""} onChange={e=>set("quantity",e.target.value)} placeholder="1"/></div>
       <div><label>CONDITION</label><select value={f.condition||"Good"} onChange={e=>set("condition",e.target.value)}>{CONDS.map(c=><option key={c}>{c}</option>)}</select></div>

       <div style={{gridColumn:"1/-1"}}><label>PHOTO <span style={{color:"var(--muted)",fontWeight:400}}>(upload from your device, or paste a link)</span></label><PhotoField value={f.photo||""} onChange={v=>set("photo",v)} prefix="qatar"/></div>

         </div>

const CAT_CODE={"Cake Smash":"CS",Newborn:"NB",Infant:"IN",Maternity:"MA",Sitter:"SI",Christmas:"XM"};
const KIND_CODE={outfit:"OF",fabric:"FB",prop:"PR",backdrop:"BD",wrap:"WR",accessory:"AC",other:"IT",setup:"SET"};
const ITEM_KINDS=["outfit","fabric","prop","backdrop","wrap","accessory","other"];
const SESSION_CATS=["Newborn","Infant","Sitter","Cake Smash","Maternity","Christmas"];
const GENDERS_T=["Girl","Boy","Twins","Neutral"];
// per-category Style (subcategory) options + which categories skip gender
const STYLE_OPTS={Maternity:["Classic Black","Classic White","Fabrics","Elegant","Exclusive Setups","Private Collection","Outdoor","New"]};
const NO_GENDER=["Maternity"];
// which item kinds are offered per session type
const KIND_BY_CAT={Maternity:["outfit","backdrop","accessory"],"Cake Smash":["outfit","prop","backdrop","accessory"],Newborn:["outfit","wrap","prop","backdrop","accessory"],Infant:["outfit","prop","backdrop","accessory"],Sitter:["outfit","prop","backdrop","accessory"],Christmas:["outfit","wrap","prop","backdrop","accessory"]};
const GENERAL_KINDS=["prop","accessory","backdrop","other"];
const SIZE_OPTS=["S","M","L","XL","One size"];
function SizePicker({value,onChange}){
 const cur=(value||"").split(",").map(s=>s.trim()).filter(Boolean);
 const toggle=s=>{const next=cur.includes(s)?cur.filter(x=>x!==s):[...cur,s];onChange(next.join(", "));};
 return <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>{SIZE_OPTS.map(s=>{const on=cur.includes(s);return <button type="button" key={s} onClick={()=>toggle(s)} style={{padding:"6px 13px",borderRadius:20,border:`1px solid ${on?"var(--ink)":"var(--line2)"}`,background:on?"var(--ink)":"var(--panel)",color:on?"#fff":"var(--soft)",fontSize:12.5,fontWeight:600}}>{s}</button>})}</div>;
}
const codePrefix=(cat,seg)=>(CAT_CODE[cat]||((cat||"XX").replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase()||"XX"))+"-"+seg;
async function nextCode(cat,seg){const p=codePrefix(cat,seg)+"-";if(!sb)return p+"001";const {data}=await sb.from("inv_item").select("code").like("code",p+"%");let mx=0;(data||[]).forEach(r=>{const m=/(\d+)\s*$/.exec(r.code||"");if(m)mx=Math.max(mx,parseInt(m[1],10))});return p+String(mx+1).padStart(3,"0");}
function Barcode({value,height=46}){const ref=useRef(null);useEffect(()=>{if(ref.current&&window.JsBarcode&&value){try{window.JsBarcode(ref.current,value,{format:"CODE128",height,fontSize:13,margin:6,displayValue:true});}catch(e){}}},[value,height]);return <svg ref={ref} style={{maxWidth:"100%"}}/>;}

function App(){

 useEffect(()=>{loadInv()},[]);
 // SINGLE SOURCE: map inv_item rows into the shape the catalogue views expect
 const allThemes=useMemo(()=>invRows.map(r=>({id:r.id,name:r.name,category:r.session_type,gender:r.gender||"",branches:(r.inv_item_location||[]).map(l=>l.location),display:!!r.website_display,selection_count:r.times_selected||0,image:r.photo_url||"",notes:r.notes||"",__inv:true,_row:r})),[invRows]);
 const [toast,setToast]=useState("");
 const notify=m=>{setToast(m);setTimeout(()=>setToast(""),4500);};
 const [session,setSession]=useState(sb?undefined:null);
 useEffect(()=>{if(!sb)return;sb.auth.getSession().then(({data})=>setSession(data.session));const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));return ()=>sub.subscription.unsubscribe()},[]);
 const [view,setView]=useState("dashboard");
 const [sel,setSel]=useState(null); const [form,setForm]=useState(null); // form = {} for new, theme for edit
 const [q,setQ]=useState(""),[cat,setCat]=useState(""),[br,setBr2]=useState(""),[gen,setGen]=useState(""),[disp,setDisp]=useState(""),[onlyPhoto,setOnlyPhoto]=useState(false),[sort,setSort]=useState("pop"),[mode,setMode]=useState("grid");
 useEffect(()=>{(async()=>{
   if(!sb){const c=localStorage.getItem("ybs_themes_v2");if(c)setThemes(JSON.parse(c));return;}
   try{const {data,error}=await sb.from("themes").select("*");
     if(!error&&data&&data.length){setThemes(data);setSource("cloud");}
     else{const c=localStorage.getItem("ybs_themes_v2");if(c)setThemes(JSON.parse(c));}
   }catch(e){const c=localStorage.getItem("ybs_themes_v2");if(c)setThemes(JSON.parse(c));}
 })()},[]);
 const persist=ts=>{if(source!=="cloud")localStorage.setItem("ybs_themes_v2",JSON.stringify(ts));};
 const toggle=async t=>{
   if(t.__inv){const nd=!t.display;setInvRows(rs=>rs.map(x=>x.id===t.id?{...x,website_display:nd}:x));if(sb){const {error}=await sb.from("inv_item").update({website_display:nd}).eq("id",t.id);if(error){setInvRows(rs=>rs.map(x=>x.id===t.id?{...x,website_display:!nd}:x));notify("Couldn't save change: "+error.message);}}return;}
   const nd=!t.display;setThemes(ts=>{const n=ts.map(x=>x.id===t.id?{...x,display:nd}:x);persist(n);return n});if(source==="cloud"&&sb){const {error}=await sb.from("themes").update({display:nd}).eq("id",t.id);if(error){setThemes(ts=>{const n=ts.map(x=>x.id===t.id?{...x,display:!nd}:x);persist(n);return n});notify("Couldn't save change: "+error.message);}}};
 const saveTheme=async d=>{
   const isNew=!d.id; const row={...d,id:d.id||newId(d.category,themes)};
   delete row.popularity; // selection_count is the source of truth in UI
   const prev=themes;
   setThemes(ts=>{const n=isNew?[row,...ts]:ts.map(x=>x.id===row.id?{...x,...row}:x);persist(n);return n});
   setForm(null); if(sel&&sel.id===row.id)setSel(row);
   if(source==="cloud"&&sb){const {error}=await sb.from("themes").upsert(row);if(error){setThemes(()=>{persist(prev);return prev});notify("Couldn't save theme: "+error.message);}}
 };
 const delTheme=async t=>{const prev=themes;setThemes(ts=>{const n=ts.filter(x=>x.id!==t.id);persist(n);return n});setSel(null);if(source==="cloud"&&sb){const {error}=await sb.from("themes").delete().eq("id",t.id);if(error){setThemes(()=>{persist(prev);return prev});notify("Couldn't delete: "+error.message);}}};
 const openCat=c=>{setCat(c);setView("catalog")}; const openBr=b=>{setBr2(b);setView("catalog")};
 const go=x=>{if(x&&x.__cat)openCat(x.__cat);else if(typeof x==="string")openCat(x);else setSel(x)};
 const selLive=sel?allThemes.find(t=>t.id===sel.id)||sel:null;
 const catState={q,setQ,cat,setCat,br,setBr:setBr2,gen,setGen,disp,setDisp,onlyPhoto,setOnlyPhoto,sort,setSort,mode,setMode};
 const signOut=()=>sb&&sb.auth.signOut();
 if(sb&&session===undefined) return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--muted)",fontSize:14}}>Loading…</div>;
 if(sb&&!session) return <LoginScreen/>;
 return <div style={{display:"flex",height:"100vh",overflow:"hidden"}}>
   <Sidebar view={view} setView={setView} themes={allThemes} setBr={openBr} source={source} signOut={signOut} email={session&&session.user&&session.user.email}/>
   <main style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",background:"var(--bg)"}}>
     {view==="dashboard"&&<Dashboard themes={allThemes} go={go}/>}
     {view==="catalog"&&<NewInventory/>}
     {view==="showcase"&&<Showcase themes={allThemes} onOpen={setSel}/>}
     {view==="categories"&&<Categories themes={allThemes} go={openCat}/>}
   </main>
   {selLive&&selLive.__inv&&<InvEdit item={selLive._row} onClose={()=>setSel(null)} onSaved={()=>{setSel(null);loadInv();}}/>}
   {selLive&&!selLive.__inv&&<Drawer t={selLive} onClose={()=>setSel(null)} onToggle={toggle} onEdit={t=>{setSel(null);setForm(t)}} onDelete={delTheme}/>}
   {form&&<ThemeForm init={form} onSave={saveTheme} onClose={()=>setForm(null)}/>}
   {toast&&<div className="fade" onClick={()=>setToast("")} style={{position:"fixed",bottom:22,left:"50%",transform:"translateX(-50%)",zIndex:400,background:"var(--danger)",color:"#fff",padding:"11px 18px",borderRadius:10,fontSize:13,fontWeight:600,boxShadow:"0 8px 24px rgba(20,20,30,.18)",maxWidth:"90vw",cursor:"pointer"}}>{toast}</div>}
 </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
